<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アクエリのデバイス日記 | 紹介商品まとめ</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0A1828;
      font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
      color: #d0e8f0;
      min-height: 100vh;
      padding: 0 0 48px;
    }

    /* ヘッダー */
    .header {
      background: linear-gradient(180deg, #0D2236 0%, #0A1828 100%);
      border-bottom: 1px solid rgba(0,196,184,0.15);
      padding: 36px 20px 28px;
      text-align: center;
    }
    .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 2.5px solid #00C4B8;
      margin: 0 auto 14px;
      background: #112233;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }
    .name {
      font-size: 20px; font-weight: 700;
      color: #00C4B8; letter-spacing: 1px;
    }
    .handle { font-size: 12px; color: #4a8a9a; margin-top: 4px; }
    .desc {
      font-size: 13px; color: #8BB8CC;
      margin-top: 10px; line-height: 1.6;
    }
    .threads-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 16px;
      background: rgba(0,196,184,0.1);
      border: 1px solid rgba(0,196,184,0.4);
      border-radius: 20px;
      padding: 7px 18px;
      font-size: 12px; color: #00C4B8;
      text-decoration: none;
      transition: background 0.2s;
    }
    .threads-btn:hover { background: rgba(0,196,184,0.2); }

    /* コンテンツ */
    .content { max-width: 520px; margin: 0 auto; padding: 0 16px; }

    /* タグフィルター */
    .filter-wrap {
      padding: 20px 0 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .filter-row {
      display: flex; gap: 8px;
      padding-bottom: 4px;
      white-space: nowrap;
    }
    .tag {
      font-size: 12px;
      background: #112233;
      border: 1px solid rgba(0,196,184,0.2);
      border-radius: 20px;
      padding: 5px 13px;
      color: #6a9aaa;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .tag.active {
      background: rgba(0,196,184,0.15);
      border-color: #00C4B8;
      color: #00C4B8;
    }

    /* セクションラベル */
    .section-label {
      font-size: 10px; letter-spacing: 2px;
      color: #00C4B8; opacity: 0.5;
      margin: 20px 0 10px;
      text-transform: uppercase;
    }

    /* 商品カード */
    .card {
      display: flex; align-items: center; gap: 12px;
      background: #112233;
      border: 1px solid rgba(0,196,184,0.15);
      border-radius: 12px;
      padding: 14px 14px;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.15s;
    }
    .card:hover {
      border-color: rgba(0,196,184,0.5);
      transform: translateY(-1px);
    }
    .card-icon {
      width: 44px; height: 44px;
      background: #0A1828;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-size: 13px; font-weight: 500;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: 11px; color: #4a8a9a;
      margin-top: 4px;
    }
    .card-badge {
      font-size: 10px;
      background: rgba(0,196,184,0.12);
      color: #00C4B8;
      border-radius: 5px;
      padding: 3px 7px;
      flex-shrink: 0;
      align-self: flex-start;
    }

    /* 空状態 */
    .empty {
      text-align: center;
      padding: 48px 0;
      color: #4a8a9a;
      font-size: 13px;
      display: none;
    }

    /* ローディング */
    .loading {
      text-align: center;
      padding: 48px 0;
      color: #4a8a9a;
      font-size: 13px;
    }

    /* フッター */
    .footer {
      text-align: center;
      padding: 32px 0 0;
      font-size: 11px;
      color: #2a4a5a;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="avatar">🎮</div>
  <div class="name">アクエリのデバイス日記</div>
  <div class="handle">@aqua_device_diary</div>
  <div class="desc">PC周辺機器を本音でレビュー<br>キーボード・マウス・モニター・ヘッドセットが専門</div>
  <a class="threads-btn" href="https://www.threads.net/@aqua_device_diary" target="_blank">
    Threads でフォローする →
  </a>
</div>

<div class="content">
  <div class="filter-wrap">
    <div class="filter-row" id="filterRow">
      <div class="tag active" data-cat="all">すべて</div>
    </div>
  </div>

  <div class="section-label">🛒 紹介した商品</div>
  <div id="cardList"><div class="loading">読み込み中...</div></div>
  <div class="empty" id="empty">該当する商品がありません</div>

  <div class="footer">
    aqua_device_diary &nbsp;|&nbsp; 投稿のたびに自動更新
  </div>
</div>

<script>
// ========== 設定 ==========
// GitHub GistのRAW URL（後でGist作成後に差し替え）
const GIST_URL = 'https://gist.githubusercontent.com/4quarius-crate/19e15a77d361ef1fff5c00b16e12890e/raw/e1aa09836786ceef146190dd250a1d755d20aea4/links.json';

// カテゴリ別絵文字
const ICONS = {
  'マウス': '🖱',
  'キーボード': '⌨️',
  'モニター': '🖥',
  'ヘッドセット': '🎧',
  'マウスパッド': '📋',
  'ゲーミングチェア': '🪑',
  '自作PC': '🔧',
  'その他': '📦',
};

let allItems = [];
let activeTag = 'all';

// ========== データ取得 ==========
async function loadLinks() {
  try {
    const res = await fetch(GIST_URL + '?t=' + Date.now());
    allItems = await res.json();
    allItems = allItems.sort((a, b) => new Date(b.date) - new Date(a.date));
    buildFilters();
    renderCards();
  } catch(e) {
    document.getElementById('cardList').innerHTML =
      '<div class="loading" style="color:#c04040">データの取得に失敗しました</div>';
  }
}

// ========== フィルター生成 ==========
function buildFilters() {
  const cats = [...new Set(allItems.map(i => i.category).filter(Boolean))];
  const row = document.getElementById('filterRow');
  cats.forEach(cat => {
    const el = document.createElement('div');
    el.className = 'tag';
    el.dataset.cat = cat;
    el.textContent = cat;
    el.onclick = () => setTag(cat);
    row.appendChild(el);
  });
  document.querySelector('[data-cat="all"]').onclick = () => setTag('all');
}

function setTag(cat) {
  activeTag = cat;
  document.querySelectorAll('.tag').forEach(t => {
    t.classList.toggle('active', t.dataset.cat === cat);
  });
  renderCards();
}

// ========== カード描画 ==========
function renderCards() {
  const items = activeTag === 'all'
    ? allItems
    : allItems.filter(i => i.category === activeTag);

  const list = document.getElementById('cardList');
  const empty = document.getElementById('empty');

  if (items.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = items.map(item => `
    <a class="card" href="${item.url}" target="_blank" rel="noopener">
      <div class="card-icon">${ICONS[item.category] || '📦'}</div>
      <div class="card-body">
        <div class="card-title">${item.title}</div>
        <div class="card-meta">${item.category || 'その他'}｜${formatDate(item.date)}</div>
      </div>
      <div class="card-badge">楽天</div>
    </a>
  `).join('');
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return `${dt.getMonth()+1}/${dt.getDate()}投稿`;
}

loadLinks();
</script>
</body>
</html>
